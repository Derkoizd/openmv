name: Build Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openmv/openmv-build:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Build firmware
        run: |
          make TARGET=OPENMV4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware_OPENMV4
          path: build/bin/firmware.bin